services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-avtopark}
      POSTGRES_USER: ${POSTGRES_USER:-avtopark}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes: [postgres_data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [internal]
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes: [redis_data:/data]
    networks: [internal]
  backend:
    build: {context: .., dockerfile: infra/Dockerfile.backend}
    restart: unless-stopped
    env_file: ../.env
    environment:
      DEBUG: "False"
      DATABASE_URL: postgresql://${POSTGRES_USER:-avtopark}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-avtopark}
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_started}
    command: sh -c "python manage.py migrate && daphne -b 0.0.0.0 -p 8000 config.asgi:application"
    ports: ["8000:8000"]
    networks: [internal]
  celery:
    build: {context: .., dockerfile: infra/Dockerfile.backend}
    restart: unless-stopped
    env_file: ../.env
    environment:
      DEBUG: "False"
      DATABASE_URL: postgresql://${POSTGRES_USER:-avtopark}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-avtopark}
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_started}
    command: ["celery", "-A", "config", "worker", "--loglevel=INFO", "--concurrency=2"]
    networks: [internal]
  frontend:
    build: {context: .., dockerfile: infra/Dockerfile.frontend}
    restart: unless-stopped
    ports: ["8080:80"]
    networks: [internal]
networks:
  internal:
    driver: bridge
volumes:
  postgres_data:
  redis_data:
